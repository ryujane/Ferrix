[package]
name = "nsh-app-ferrix"
version = "0.1.2"
edition = "2024"
publish = false

[workspace]

[features]
redis-observer = []
native-performance = ["redis-observer"]

[dependencies]
nsh-base = { git = "https://github.com/longbridge/nsh", tag = "v0.6.1" }
nsh-core = { git = "https://github.com/longbridge/nsh", tag = "v0.6.1" }
redis = { version = "1.8.1", features = ["tokio-rustls-comp"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
rustls-native-certs = "0.8"
# Russh's RSA feature requires stable RSA 0.10, while NSH WebCrypto still uses
# the release candidate. Use it to parse RSA keys and ring to sign SSH requests.
russh = { version = "0.65.1", default-features = false, features = ["ring", "flate2"] }
ring = "0.17.14"
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["encoding", "pkcs5"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12"] }
tokio = { version = "1.54.1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["raw_value"] }
unicode-normalization = "0.1"
uuid = { version = "1", features = ["v4"] }
zeroize = "1"
keepass = { version = "0.17", features = ["save_kdbx4"] }
sha2 = "0.10"
base64 = "0.22"
flate2 = "1"
zstd = "0.14"
lz4_flex = "0.14"
snap = "1"
rmpv = "1"
deser = "0.10.2"
deser-pickle = "0.10.2"
deser-value = "0.10.2"
deser-json = "0.10.2"
url = "2"
percent-encoding = "2"
tempfile = "3"
rust-argon2 = "3"

[dev-dependencies]
nsh-bundler = { git = "https://github.com/longbridge/nsh", tag = "v0.6.1" }
nsh-engine = { git = "https://github.com/longbridge/nsh", tag = "v0.6.1" }
tempfile = "3"
rcgen = "0.14"
serde_json = "1"
rand = "0.10"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Networking_WinHttp"] }
# Keep the platform runner on the same NSH Git checkout as the app.
nsh-platform-windows = { git = "https://github.com/longbridge/nsh", tag = "v0.6.1" }
keyring = { version = "3.6.3", default-features = false, features = ["windows-native"] }

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10"
nsh-platform-macos = { git = "https://github.com/longbridge/nsh", tag = "v0.6.1" }
serde_json = "1"
keyring = { version = "3.6.3", default-features = false, features = ["apple-native"] }

[target.'cfg(target_os = "linux")'.dependencies]
keyring = { version = "3.6.3", default-features = false, features = ["sync-secret-service", "crypto-rust", "vendored"] }

[target.'cfg(windows)'.dev-dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_Security", "Win32_System_JobObjects", "Win32_System_Threading", "Win32_System_ProcessStatus", "Win32_System_SystemInformation", "Win32_System_Console", "Win32_UI_Controls", "Win32_UI_Shell", "Win32_UI_HiDpi", "Win32_UI_WindowsAndMessaging"] }
