name: CI

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pr-checks-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  check:
    name: Check
    runs-on: ubuntu-24.04
    env:
      RUSTUP_TOOLCHAIN: stable
      CARGO_INCREMENTAL: '0'
      NSH_VERSION: v0.7.1

    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install Rust
        run: rustup toolchain install stable --profile minimal

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y clang libclang-dev libgtk-4-dev libwebkitgtk-6.0-dev \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev

      - name: Install NSH
        run: bash .github/scripts/setup-nsh.sh nsh-linux-x86_64.tar.gz

      - name: Type check
        run: nsh check

      - name: Build
        run: nsh build

      - name: Test
        run: nsh test
